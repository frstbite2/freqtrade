# Alembic entry point for the platform. Run from the repository root:
#   alembic -c backend/alembic.ini upgrade head
# The database comes from DATABASE_URL / config/settings.yaml, the same as the application.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
