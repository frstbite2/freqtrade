name: Platform CI

# Checks for the AI trading platform (backend/). Upstream freqtrade is covered by ci.yml.
on:
  pull_request:
    paths:
      - "backend/**"
      - "config/**"
      - "docker/Dockerfile.platform"
      - "docker-compose.platform.yml"
      - "requirements-platform.txt"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions: {}

jobs:
  checks:
    name: "Tests, lint, type check"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform.txt

      - name: Install
        run: pip install -r requirements-platform.txt "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check backend && ruff format --check backend

      - name: Type check
        run: mypy --config-file backend/mypy.ini backend

      # Live tests (SEC, Alpaca) are opt-in and stay skipped here: no network data, no secrets.
      - name: Tests
        working-directory: backend
        run: pytest

  docker:
    name: "Docker image builds and passes its tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f docker/Dockerfile.platform -t platform:ci .

      - name: Tests inside the image
        run: docker run --rm -w /app/backend platform:ci pytest -p no:cacheprovider
