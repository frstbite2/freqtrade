# Non-secret application settings. Secrets (API keys) belong in .env only;
# unknown keys here are rejected at startup.
# Env overrides: APP_ENV, DATABASE_URL, LOG_LEVEL, SEC_USER_AGENT.
environment: development
trading_mode: paper        # the only mode; live trading is gated separately (Milestone 7)
database_url: sqlite:///data/platform.sqlite
log_level: INFO
log_json: true
alpaca_feed: iex            # iex (free, one exchange) | sip (paid, whole market) | delayed_sip
api_rate_limit_per_minute: 120   # per client address; applies before authentication

# Investment managers whose quarterly 13F holdings are tracked, by SEC CIK number.
# Names confirmed on EDGAR on 2026-11-13. Add or remove freely; very large quantitative
# managers (Citadel, Millennium, Renaissance) file tens of thousands of rows per quarter.
